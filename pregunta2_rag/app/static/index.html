<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Consulta documental RAG</title><link rel="stylesheet" href="/static/style.css"></head><body><main><header><h1>Consulta de operaciones de transporte</h1><p>Respuestas en español con evidencia por documento y página física.</p></header>
<section><h2>1. Ingestar los tres PDF</h2><form id="upload"><input id="file" type="file" accept="application/pdf" required><button>Procesar PDF</button></form><p id="uploadMsg"></p><div id="documents"></div></section>
<section><h2>2. Hacer una pregunta</h2><form id="ask"><label>Documento<select id="filter"><option value="">Consultar los tres documentos</option></select></label><label>Pregunta<textarea id="question" required minlength="3" rows="4" placeholder="¿Qué procedimiento se aplica ante...? "></textarea></label><button>Responder</button></form><p id="status"></p><article id="answer" hidden><h3>Respuesta</h3><div id="answerText"></div><h3>Pasajes utilizados</h3><div id="passages"></div></article></section></main><script src="/static/app.js"></script></body></html>
